name: mom-photography
services:
  database:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - ./.local/db-data/:/var/lib/postgresql/data/
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  s3:
    image: adobe/s3mock:latest
    ports:
      - "9090:9090"
    environment:
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIALBUCKETS=photography
      - COM_ADOBE_TESTING_S3MOCK_STORE_RETAINFILESONEXIT=true
      - COM_ADOBE_TESTING_S3MOCK_STORE_ROOT=/data
    volumes:
      - ./.local/s3-data/:/data
